name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: retracesoftware

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        working-directory: retracesoftware
        run: pip install meson-python meson ninja setuptools_scm pytest

      - name: Build and install
        working-directory: retracesoftware
        run: pip install -e . --no-build-isolation

      - name: Run tests
        working-directory: retracesoftware
        run: python -m pytest tests/ -v --tb=short
